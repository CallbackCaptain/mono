<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OmniChat AutoResponder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 260px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1f2e;
            color: #fff;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 14px 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }

        .content {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.off { background: #ef4444; }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #252b3d;
            padding: 12px;
            border-radius: 8px;
        }

        .toggle-label { font-size: 14px; }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #3a4050;
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .footer {
            padding: 10px 16px;
            border-top: 1px solid #252b3d;
            font-size: 11px;
            color: #505870;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">AutoResponder v5</div>

    <div class="content">
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Loading...</span>
        </div>

        <div class="toggle-row">
            <span class="toggle-label">Автоответ</span>
            <label class="toggle">
                <input type="checkbox" id="autoToggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="footer">Console: omniResponder.help()</div>

    <script src="popup.js"></script>
</body>
</html>
