<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OmniChat AutoResponder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1f2e;
            color: #fff;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
        }

        .header-version {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: #252b3d;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            flex-shrink: 0;
        }

        .status-dot.off { background: #ef4444; }

        .status-dot.busy {
            background: #facc15;
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.4; }
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #3a4050;
            border-radius: 24px;
            transition: 0.3s;
        }

        .toggle input:disabled + .toggle-slider {
            cursor: default;
            opacity: 0.4;
        }

        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: #252b3d;
            border-radius: 10px;
            padding: 10px 12px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 11px;
            color: #8b93ab;
            margin-top: 2px;
        }

        .offline .stat-value { color: #505870; }

        .footer {
            padding: 10px 16px;
            border-top: 1px solid #252b3d;
            font-size: 11px;
            color: #505870;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-title">AutoResponder</span>
        <span class="header-version" id="version"></span>
    </div>

    <div class="content">
        <div class="card status-row">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Загрузка...</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="autoToggle" disabled>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat">
                <div class="stat-value" id="statToday">—</div>
                <div class="stat-label">Сегодня</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statTotal">—</div>
                <div class="stat-label">Всего обработано</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statQueue">—</div>
                <div class="stat-label">В очереди</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statExtra">—</div>
                <div class="stat-label">Доп. время</div>
            </div>
        </div>
    </div>

    <div class="footer">Console: omniResponder.help()</div>

    <script src="popup.js"></script>
</body>
</html>
